name: gitleaks

# Server-side backstop for the pre-commit hook (see PLAN.md "Secrets
# management"): catches anything pushed from a worktree where the hook
# wasn't installed, or committed with --no-verify.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
