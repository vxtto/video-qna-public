name: PR validation

# Required check for merging to main (see branch protection settings).
# This is the gate the deploy workflow (deploy.yml) trusts: passing here is
# what makes a merge to main eligible to go out.
#
# `tests` (pytest, unit + integration) is a required check alongside lint/
# docker-build/migrations/compose-smoke. `e2e` (Playwright, real browser)
# is deliberately NOT required - it's the flakiest layer by nature, kept
# around to catch regressions but not to block merges until it's proven
# stable over time. See e2e/README.md.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/
      # ruff format --check is deliberately not enforced yet: the existing
      # codebase predates this config and running it would force an
      # unrelated mass-reformat diff into whatever PR happens to add this
      # workflow. Run `ruff format backend/` once as its own PR, then add
      # the check step back here.

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t video-qna-backend:ci

  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: video_qna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in filename order
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d video_qna -f "$f"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Check docs/SCHEMA.md is up to date
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/video_qna
        run: |
          python3 scripts/gen-schema-doc.py
          if ! git diff --exit-code -- docs/SCHEMA.md; then
            echo "::error::docs/SCHEMA.md is stale — run" \
              "'DATABASE_URL=... python3 scripts/gen-schema-doc.py' and commit the result."
            exit 1
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build, migrations]
    env:
      # Job-level, not step-level — docker compose down (teardown step)
      # needs to re-interpolate this too, not just the up step.
      OPENROUTER_API_KEY: ci-dummy-key-not-a-real-secret
      # DB_PORT/API_PORT became required (no silent default) in
      # docker-compose.yml on 2026-09-03 to force local dev through
      # scripts/dev-up.sh — CI has no worktree/.env, so it needs these
      # supplied directly. Single throwaway instance, no collision risk,
      # so the plain defaults are fine here.
      DB_PORT: "5432"
      API_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - name: Bring up db + api with dummy secrets
        run: docker compose up --build -d db api
      - name: Wait for api to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/videos > /dev/null; then
              echo "api is up"
              exit 0
            fi
            sleep 2
          done
          echo "api never came up in time"
          docker compose logs
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: video_qna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # test_media_range.py reads e2e/fixtures/sample_clip.mp4 (git-lfs)
          # for the Range-request tests - a plain checkout would only get
          # the pointer file.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Run pytest (unit + integration)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/video_qna
          OPENROUTER_API_KEY: ci-dummy-key-not-a-real-secret
        run: pytest -q
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: [docker-build, migrations]
    # Real-browser tests are the flakiest layer by nature - don't block
    # merges on this one until it's proven stable over time (see the note
    # at the top of this file and e2e/README.md).
    continue-on-error: true
    env:
      OPENROUTER_API_KEY: ci-dummy-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # needed for e2e/fixtures/sample_clip.mp4
      - name: Seed the fixture video into the compose media mount
        run: |
          mkdir -p data/media/raw
          cp e2e/fixtures/sample_clip.mp4 data/media/raw/
      - name: Bring up db + api
        run: docker compose up --build -d db api
      - name: Wait for api to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/videos > /dev/null; then
              echo "api is up"
              exit 0
            fi
            sleep 2
          done
          echo "api never came up in time"
          docker compose logs
          exit 1
      - name: Seed the fixture video's DB row
        run: docker compose exec -T db psql -U postgres -d video_qna -f - < e2e/seed_fixture.sql
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright tests
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test
        working-directory: e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
