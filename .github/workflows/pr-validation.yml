name: PR validation

# Required check for merging to main (see branch protection settings).
# Scope is deliberately "does this actually build and run", not full
# integration testing — there's no test suite yet (see docs/STATUS.md /
# CLAUDE.md). This is the gate the deploy workflow (deploy.yml) trusts:
# passing here is what makes a merge to main eligible to go out.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/
      # ruff format --check is deliberately not enforced yet: the existing
      # codebase predates this config and running it would force an
      # unrelated mass-reformat diff into whatever PR happens to add this
      # workflow. Run `ruff format backend/` once as its own PR, then add
      # the check step back here.

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t video-qna-backend:ci

  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: video_qna
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in filename order
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d video_qna -f "$f"
          done

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build, migrations]
    env:
      # Job-level, not step-level — docker compose down (teardown step)
      # needs to re-interpolate this too, not just the up step.
      OPENROUTER_API_KEY: ci-dummy-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - name: Bring up db + api with dummy secrets
        run: docker compose up --build -d db api
      - name: Wait for api to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/videos > /dev/null; then
              echo "api is up"
              exit 0
            fi
            sleep 2
          done
          echo "api never came up in time"
          docker compose logs
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
