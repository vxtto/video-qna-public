services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_qna}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs every *.sql in this dir, in filename order, on first
      # init of an empty volume only. Numbered so migration order is explicit.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Parameterized so parallel worktrees on one box don't fight over the
      # same host port — see scripts/dev-up.sh, which self-assigns free
      # ports into each worktree's own gitignored .env on first run.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-video_qna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Curated movie files + transcript JSON, mounted read-only. This is
      # NOT video-processing/data/ (that's the pipeline's full working
      # directory — raw sources, audio, chunks, intermediate transcripts).
      # Publish just the 480p mp4s + final transcript JSON here, e.g.:
      #   cp video-processing/data/raw/*_480p.mp4 data/media/raw/
      #   cp video-processing/data/transcripts/*.json data/media/transcripts/
      # Matches the VPS layout exactly (/opt/video-qna/app/data/media) —
      # see DEPLOY.md's media section.
      #
      # MEDIA_HOST_DIR lets multiple worktrees on one box point at ONE
      # shared copy of these (multi-hundred-MB) files instead of each
      # worktree duplicating them under its own ./data/media — set it in
      # that worktree's .env. Defaults to the worktree-local path so a
      # single-worktree setup needs no config. See PLAN.md's "A note on
      # worktrees" / "Running several worktrees in parallel".
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media:ro
    ports:
      # See db's port comment above — same reasoning.
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
