services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_qna}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs every *.sql in this dir, in filename order, on first
      # init of an empty volume only. Numbered so migration order is explicit.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-video_qna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 480p mp4s (data/media/raw/) + transcript JSON
      # (data/media/transcripts/), mounted read-only.
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media:ro
    ports:
      # Localhost only: the app has no auth of its own (see app/auth.py).
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  pgdata:
