[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Starter set: correctness/import hygiene only, not full style. Widen once
# the codebase has been run through this once and the diff is reviewed.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests need a real Postgres (DATABASE_URL) — see
# tests/conftest.py, which applies db/migrations/*.sql once per session and
# truncates all tables between tests. Unit tests need no DB or network at
# all (openrouter/httpx calls are mocked via respx).
