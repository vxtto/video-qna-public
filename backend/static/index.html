<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>video-qna — transcript review</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>video-qna <span class="tag">placeholder</span></h1>
    <div class="movie-selector">
      <label for="video-picker">Movie</label>
      <select id="video-picker"></select>
    </div>
  </header>

  <main>
    <section class="player-pane">
      <h2 id="movie-title" class="movie-title"></h2>
      <video id="player" controls></video>
      <p class="progress" id="progress"></p>
      <ol id="chapters" class="chapters"></ol>
    </section>

    <section class="transcript-pane">
      <ol id="segments"></ol>
    </section>

    <section class="chat-pane">
      <h2>agent <span class="tag">test console</span></h2>
      <ol id="chat-log"></ol>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about this video..." autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
