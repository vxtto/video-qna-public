<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>video-qna</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>video-qna</h1>
    <div class="movie-selector">
      <label for="video-picker">Movie</label>
      <select id="video-picker"></select>
    </div>
  </header>

  <main>
    <section class="player-pane">
      <h2 id="movie-title" class="movie-title"></h2>
      <video id="player" controls></video>
      <p class="progress" id="progress"></p>
      <ol id="chapters" class="chapters"></ol>
    </section>

    <section class="transcript-pane">
      <ol id="segments"></ol>
    </section>

    <section class="chat-pane">
      <div class="chat-pane-header">
        <h2>agent <span class="tag">test console</span></h2>
        <div class="chat-controls">
          <button id="tray-toggle" type="button" title="Chat history">🕘 Chats</button>
          <button id="new-chat-btn" type="button" title="Start a new chat">+ New chat</button>
        </div>
      </div>
      <ol id="chat-log"></ol>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about this video..." autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>

  <div id="tray-backdrop" class="tray-backdrop" hidden></div>
  <aside id="chat-tray" class="chat-tray" hidden>
    <div class="chat-tray-header">
      <h3>Chats</h3>
      <button id="tray-close" type="button" aria-label="Close chat history">✕</button>
    </div>
    <ol id="tray-list" class="tray-list"></ol>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
